<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#00A86B">
<title>eWiqenFarm - Sistem Peternakan & Qurban</title>
<style>
  /* Reset */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  html, body {
    height: 100%;
    overflow: hidden;
    background: #F5F7F6;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  
  /* Iframe wrapper — potong banner GAS di atas */
  .app-iframe {
    position: absolute;
    top: -50px;              /* Geser ke atas untuk memotong banner */
    left: 0;
    width: 100%;
    height: calc(100% + 50px); /* Tambah tinggi 50px */
    border: none;
    display: block;
    background: #F5F7F6;
  }
  
  /* Loading screen (muncul sebelum iframe ready) */
  .loading-screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #F0FDF4 0%, #DCFCE7 100%);
    z-index: 9999;
    transition: opacity 0.5s ease;
  }
  
  .loading-screen.hide {
    opacity: 0;
    pointer-events: none;
  }
  
  .loading-logo {
    width: 96px;
    height: 96px;
    background: linear-gradient(135deg, #22C55E 0%, #16A34A 100%);
    border-radius: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 46px;
    box-shadow: 0 16px 40px rgba(34, 197, 94, 0.4);
    margin-bottom: 24px;
    animation: logoFloat 2s ease-in-out infinite;
  }
  
  @keyframes logoFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-8px) rotate(-3deg); }
  }
  
  .loading-text {
    font-size: 14px;
    color: #6B7280;
    font-weight: 600;
  }
  
  .loading-spinner {
    width: 32px;
    height: 32px;
    border: 3px solid rgba(34, 197, 94, 0.2);
    border-top-color: #16A34A;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-top: 16px;
  }
  
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>

<!-- Loading Screen -->
<div class="loading-screen" id="loadingScreen">
  <div class="loading-logo">🐐</div>
  <div class="loading-text">Memuat eWiqenFarm...</div>
  <div class="loading-spinner"></div>
</div>

<!-- Iframe Web App -->
<iframe 
  class="app-iframe" 
  id="appIframe"
  src="https://script.google.com/macros/s/AKfycbyh7oGyXOGcqs9LmdDGViXuuZE-HrkSazvKc-smi4COvWqwUlyFnjtor0zvvFcuzTEZKg/exec"
  allow="camera; microphone; geolocation; clipboard-read; clipboard-write"
  loading="eager">
</iframe>

<script>
  // ============================================================
  // Hide loading screen saat iframe selesai load
  // ============================================================
  const iframe = document.getElementById('appIframe');
  const loadingScreen = document.getElementById('loadingScreen');
  
  // Timeout fallback — hide loading setelah 8 detik
  const fallbackTimer = setTimeout(() => {
    loadingScreen.classList.add('hide');
  }, 8000);
  
  iframe.addEventListener('load', () => {
    clearTimeout(fallbackTimer);
    // Delay sedikit biar smooth
    setTimeout(() => {
      loadingScreen.classList.add('hide');
    }, 500);
  });
  
  // ============================================================
  // Deteksi device — android/ios untuk height fix
  // ============================================================
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if (isMobile) {
    // Sesuaikan tinggi di mobile (fix keyboard, address bar)
    window.addEventListener('resize', () => {
      document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
    });
  }
</script>

</body>
</html>
